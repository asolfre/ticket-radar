name: TicketRadar
options:
  bundleIdPrefix: com.asolfre.ticketradar
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

targets:
  TicketRadar:
    type: application
    platform: macOS
    sources:
      - path: TicketRadar/Sources
      - path: TicketRadar/Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.asolfre.ticketradar
        PRODUCT_NAME: TicketRadar
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "6"
        SWIFT_VERSION: "5.10"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        INFOPLIST_FILE: TicketRadar/Resources/Info.plist
        CODE_SIGN_STYLE: Automatic
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: TicketRadar/Resources/Info.plist
      properties:
        CFBundleName: TicketRadar
        CFBundleDisplayName: TicketRadar
        CFBundleIdentifier: com.asolfre.ticketradar
        CFBundleVersion: "6"
        CFBundleShortVersionString: "0.1.0"
        CFBundlePackageType: APPL
        CFBundleExecutable: TicketRadar
        CFBundleIconName: AppIcon
        LSMinimumSystemVersion: "14.0"
        LSUIElement: false
        NSHumanReadableCopyright: "Copyright 2026 asolfre. MIT License."
