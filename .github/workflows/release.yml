name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Only the release build: ci.yml must already be green on the tagged commit.
  release:
    # Keep runner, DEVELOPER_DIR and the version check in sync with ci.yml.
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false  # later steps need no git auth; gh uses GH_TOKEN

      - name: Xcode version
        run: xcodebuild -version | tee /dev/stderr | grep '^Xcode 27\.1' >/dev/null

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      # After generating: the generated Info.plist is the one that ships.
      - name: Tag must match the app version
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' TicketRadar/Resources/Info.plist)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Release build (universal)
        run: >-
          xcodebuild -project TicketRadar.xcodeproj -scheme TicketRadar
          -configuration Release -destination 'generic/platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/dd" -quiet build

      - name: Build and check the DMG
        run: |
          # hdiutil fails intermittently ("Resource temporarily unavailable",
          # seen locally right after a fresh build, image busy for >30 s).
          retry() { for i in 1 2 3 4 5 6; do "$@" && return; echo "retry $i: $1 $2"; sleep 10; done; return 1; }
          dmg="TicketRadar-$VERSION-macos-universal.dmg"
          stage="$RUNNER_TEMP/dmg" mnt="$RUNNER_TEMP/mnt"
          mkdir "$stage"
          ditto "$RUNNER_TEMP/dd/Build/Products/Release/TicketRadar.app" "$stage/TicketRadar.app"
          ln -s /Applications "$stage/Applications"
          retry hdiutil create -volname "TicketRadar $VERSION" -srcfolder "$stage" -format UDZO -ov "$dmg"
          # Check what ships: -verify checks the image checksums, then the app inside.
          retry hdiutil attach -verify -readonly -nobrowse -mountpoint "$mnt" "$dmg"
          trap 'hdiutil detach "$mnt" -quiet' EXIT
          for arch in arm64 x86_64; do
            lipo "$mnt/TicketRadar.app/Contents/MacOS/TicketRadar" -verify_arch "$arch" ||
              { echo "::error::DMG app lacks $arch"; exit 1; }
          done
          codesign --verify --strict "$mnt/TicketRadar.app"
          [ "$(readlink "$mnt/Applications")" = /Applications ] ||
            { echo "::error::DMG lacks the Applications link"; exit 1; }
          shasum -a 256 "$dmg" > "$dmg.sha256"
          echo "DMG=$dmg" >> "$GITHUB_ENV"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$DMG" "$DMG.sha256" \
            --title "TicketRadar $VERSION" --notes-from-tag
          assets=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')
          echo "$assets"
          for f in "$DMG" "$DMG.sha256"; do
            grep -Fx "$f" <<<"$assets" >/dev/null ||
              { echo "::error::release is missing asset $f"; exit 1; }
          done
